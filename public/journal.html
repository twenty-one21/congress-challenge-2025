<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate | Journals</title>
    <link rel="stylesheet" href="../src/styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<header>
    <a href="index.html" style="text-decoration: none; color: inherit;">
      <h2>Mindmate</h2>
    </a>
    <nav>
        <a href="about.html">About</a>
        <a href="journal.html">Journal</a>
        <a href="videos.html">Videos</a>
        <a href="resources.html">Resources</a>
        <a id="sign-in" href="sign-in"><img src="../assets/Button.png" alt="Sign in"></a>
    </nav>
</header>
<body>
    <h1>My Journal</h1>

    <form id="journalForm">
        <input type="text" id="title" placeholder="Journal Title" required/>
        <br />
        <textarea id="content" rows="10" cols="50" placeholder="Write your thoughts here..."></textarea>
        <br />
        <button type="submit">Save Journal</button>
    </form>

    <ul id="journalList"></ul>

    <script type = "module" src="../src/firebase.js"></script>
    <script type = "module" src="../src/journal.js"></script>
    <script type="module">
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  const auth = getAuth();
  const signInLink = document.getElementById("sign-in");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User is signed in → show profile/email
      signInLink.innerHTML = `<span id="user-email">${user.email}</span>`;
      signInLink.href = "#"; // prevent default

      // Optional: add a small dropdown for Sign Out
      const dropdown = document.createElement("div");
      dropdown.id = "user-dropdown";
      dropdown.innerHTML = `<button id="signOutBtn">Sign Out</button>`;
      dropdown.style.position = "absolute";
      dropdown.style.background = "#fff";
      dropdown.style.border = "1px solid #ccc";
      dropdown.style.padding = "8px";
      dropdown.style.marginTop = "5px";
      dropdown.style.display = "none";
      signInLink.parentElement.appendChild(dropdown);

      // Show dropdown when email clicked
      signInLink.addEventListener("click", (e) => {
        e.preventDefault();
        dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
      });

      // Sign out when button clicked
      document.getElementById("signOutBtn").addEventListener("click", async () => {
        await signOut(auth);
        window.location.reload();
      });

    } else {
      // User not signed in → show Sign In button
      signInLink.innerHTML = '<img src="../assets/Button.png" alt="Sign in">';
      signInLink.href = "sign-in.html";
    }
  });
</script>

</body>
</html>
