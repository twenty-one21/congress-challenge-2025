<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindmate | Sign In</title>
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="manifest" href="/manifest.webmanifest">
</head>

<script src="/app.js"></script>

<body>
  
  <script type="module" src="/firebase.js"></script>
  <div class="signin-container">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="authBtn">Sign In / Sign Up</button>
  </div>

  <script type="module">
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const auth = getAuth();

    document.getElementById("authBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      try {
        // Try signing in first
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        //alert("Signed in successfully! Welcome back " + userCredential.user.email);
        window.location.href = "index.html";
      } catch (error) {
        if (error.code === "auth/invalid-credential") {
          // If user doesn't exist, create account
          try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            //alert("Signed up successfully! Welcome " + userCredential.user.email);
            window.location.href = "index.html";
          } catch (signupError) {
            alert("Sign-up Error: " + signupError.message);
          }
        } else {
          alert("Sign-in Error: " + error.message);
        }
      }
    });
  </script>
</body>
</html>
