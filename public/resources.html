<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMate | Global Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <h2>💬 Peer Reflection Space</h2>
        <p>Anonymous support circles based on mood themes. Share your reflections or encouragement!</p>

        <div class="chat-window" id="chat-window">
            <div class="message ai-message">Welcome! This is a safe space 💛</div>
        </div>

        <input type="text" id="chat-input" placeholder="Type your message...">
        <button id="send-btn">Send</button>
    </div>

    <script src="global-chat.js"></script>
</body>
</html>
